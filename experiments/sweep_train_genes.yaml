# ─────────────────────────────────────────────────────────────────────────────
# DRY-RUN TEMPLATE — gene-expression training (train_genes.py, flow in adata.X space).
# Short iterations to validate the pipeline end-to-end; bump num_iterations/valid_freq
# and add real swept params once it runs clean.
#
#   wandb sweep experiments/sweep_train_genes.yaml     → prints sweep_id
#   wandb agent <entity>/<project>/<sweep_id>
# ─────────────────────────────────────────────────────────────────────────────

project: sciplex_genes
program: experiments/train_genes.py
method:  grid

metric:
  goal: maximize
  name: val_nn_displacement_corr

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}          # so wandb passes params as hydra overrides (key=value)

parameters:
  wandb.enabled:
    value: true

  # ── swept (example: 2 runs) — replace/extend with the knobs you want ────────
  model.condition_encoder.cond_output_dropout:
    values: [0.1, 0.9]

  # ── fixed (dry run: short) ──────────────────────────────────────────────────
  datasets:
    value: h5ad_genes
  data:
    value: genes
  selected_datasets:
    value: [sciplex]

  # ── YOUR h5ad + the same 2000 genes as recon ────────────────────────────────
  datasets.sciplex.path:
    value: /storage/pancellflow/sciplex3_with_emb.h5ad     # ← your h5ad
  data.var_names_file:
    value: /storage/pancellflow/var_names.json             # ← same genes/order as recon (JSON list)

  # ── split: SAME held-out-drug split as the zarr training (deterministic) ─────
  split.by:
    value: [drug]
  split.ratios:
    value: [0.7, 0.2, 0.1]
  split.random_state:
    value: 42

  ablation.mode:
    value: default                 # no prophet token
  model.conditioning_key:
    value: concatenation
  match_fn.epsilon:
    value: 1.0
  training.peak_lr:
    value: 1.0e-4
  training.batch_size:
    value: 512
  training.warmup_iterations:
    value: 100
  training.num_iterations:
    value: 500                     # DRY RUN — raise for a real run (e.g. 100000+)
  training.valid_freq:
    value: 250                     # DRY RUN — raise accordingly

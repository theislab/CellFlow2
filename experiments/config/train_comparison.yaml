# @package _global_
# Hydra entry for the cellflow h5ad trainer (experiments/train_comparison.py). Pick a dataset with an
# experiment — the `data:` group is the scaleflow DataManager schema, translated to cellflow with
# SEPARATE drug_0/drug_1 tokens (see train_comparison.py):
#   python experiments/train_comparison.py +experiment=combosciplex_h5ad
#   python experiments/train_comparison.py +experiment=sciplex3_h5ad ablation=prophet wandb.enabled=true
#   python experiments/train_comparison.py +experiment=combosciplex_h5ad training.num_iterations=300 training.valid_freq=150
defaults:
  - solver: otfm
  - datasets: h5ad_drug
  - data: sciplex3_gene         # placeholder; an experiment overrides /data
  - model: h5ad
  - condition_encoder: mlp
  - conditioning: adaln_zero
  - match_fn: h5ad
  - split: drug
  - training: default
  - ablation: default
  - wandb: default
  - _self_

seed: 42
output_dir: /storage/pancellflow/outputs
selected_datasets: [sciplex3]
eval_test: false                # register the test set in-loop too (default: test held out during training)

recon:
  decoder_path: null            # gene-space default → no decode; an experiment may set a decoder

diagnostics:
  enabled: true
  splits: [train, val, test]    # split-coloured effect-size panels at train-end (one predict pass each)
  n_conditions: 100             # cap on conditions per split for the final diagnostic pass
  max_cells: 2000

hydra:
  job:
    chdir: false                # keep cwd = experiments/ so relative config_path + /storage paths hold
  output_subdir: null
  run:
    dir: ${output_dir}/.hydra

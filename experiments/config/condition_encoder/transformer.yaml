# @package _global_
# Transformer condition encoder (BERT/ViT-style, "Option 2"): the per-modality MLP (encoder_arch)
# projects each covariate token to a common dim, then a learnable CLS token is prepended and
# `num_layers` self-attention transformer layers run over {CLS, *covariate tokens} so every covariate
# attends to every other; the CLS token's final state is the condition embedding.
#
# No positional encodings → permutation-invariant over the covariate set, so single-drug,
# combinations, and with/without-patient conditions are all handled by the token mask in one model.
# Deepens the same CLS path attention_token already uses at num_layers=1.
model:
  condition_encoder:
    pooling: attention_token
    pooling_kwargs:
      num_heads: 8
      qkv_dim: 128            # attention (query/key/value) width
      num_layers: 2           # two transformer layers over {CLS, *tokens}
      transformer_block: true # full transformer block (attention + feed-forward, residual + LayerNorm)
      layer_norm: true
      dropout_rate: 0.0
      # ff_dim: 1024          # FFN hidden width (per-token). Omit → 4 * input_dim (canonical expansion).

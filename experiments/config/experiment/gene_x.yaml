# @package _global_
# ─────────────────────────────────────────────────────────────────────────────
# SINGLE (non-sweep) CFG run directly on GENE EXPRESSION (adata.X, 2000 HVGs).
# No autoencoder, no reconstruction decoder — the model predicts genes directly,
# so recon metrics are OFF (embedding=X sets recon.decoder_path=null). Launch with:
#
#   python experiments/train_zarr.py +experiment=gene_x wandb.run_name=my_run_name
#
# CFG stays on (condition_dropout_prob=0.15); set it to 0.0 for a plain baseline.
# match_fn.epsilon and hidden dims are gene-space starting points — tune as needed
# (2000-dim gene space has a larger cost scale than the 128-dim AE latents).
# ─────────────────────────────────────────────────────────────────────────────
defaults:
  - override /datasets: zarr_sciplex
  - override /conditioning: adaln_zero
  - override /embedding: X
  - override /ablation: default

selected_datasets: [sciplex]
output_dir: /storage/pancellflow/outputs/gene_x

model:
  hidden_dims: [256, 256, 256]
  decoder_dims: [256, 256, 256]          # adaln_zero requires decoder_dims[-1] == hidden_dims[-1]
  condition_embedding_dim: 256
  condition_dropout_prob: 0.15           # CFG on (>0). Set 0.0 for a no-CFG baseline.
  layer_norm_before_concatenation: false
  probability_path_kwargs:
    constant_noise: 0.1
  condition_encoder:
    cond_output_dropout: 0.2

ablation:
  mode: prophet

match_fn:
  epsilon: 10                            # gene-space starting point — tune (likely larger than latents)

training:
  peak_lr: 1.0e-4
  batch_size: 512
  warmup_iterations: 5000
  num_iterations: 2000000
  valid_freq: 200000

wandb:
  enabled: true
  entity: pancellflow
  project: sciplex_cfg
  run_name: cfg_gene_x_adaln             # ← set per run (or override: wandb.run_name=...)

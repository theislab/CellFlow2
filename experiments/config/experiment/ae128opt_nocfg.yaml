# @package _global_
# ─────────────────────────────────────────────────────────────────────────────
# SINGLE (non-sweep) run on the AE_128_opt latent, adaln_zero conditioning, with
# GUIDANCE / CFG COMPLETELY OFF. condition_dropout_prob=0.0 → solver.cfg_enabled
# is False, so: no v_null is ever computed, prediction is the plain conditional
# path, and val/test/diagnostics run a single w=1.0 pass (no guidance sweep — this
# also avoids the stiff w>1 ODE hang). No-CFG baseline counterpart to cfg_ae128opt.yaml.
#
#   python experiments/train_zarr.py +experiment=ae128opt_nocfg wandb.run_name=my_run_name
# ─────────────────────────────────────────────────────────────────────────────
defaults:
  - override /datasets: zarr_sciplex
  - override /conditioning: adaln_zero
  - override /embedding: AE_128_opt
  - override /ablation: default

selected_datasets: [sciplex]
output_dir: /storage/pancellflow/outputs/ae128opt_nocfg

model:
  hidden_dims: [256, 256, 256]
  decoder_dims: [256, 256, 256]          # adaln_zero requires decoder_dims[-1] == hidden_dims[-1]
  condition_embedding_dim: 256
  condition_dropout_prob: 0.0            # CFG OFF → conditional-only path, no w-sweep
  layer_norm_before_concatenation: false
  probability_path_kwargs:
    constant_noise: 0.1
  condition_encoder:
    cond_output_dropout: 0.2

ablation:
  mode: prophet

match_fn:
  epsilon: 10                            # AE_128_opt healthy value (matches cfg_ae128opt.yaml)

training:
  peak_lr: 1.0e-4
  batch_size: 512
  warmup_iterations: 5000
  num_iterations: 2000000
  valid_freq: 200000

wandb:
  enabled: true
  entity: pancellflow
  project: sciplex_cfg
  run_name: ae128opt_nocfg

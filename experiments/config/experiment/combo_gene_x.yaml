# @package _global_
# ─────────────────────────────────────────────────────────────────────────────
# CellFlow2 on comboSciplex, GENE SPACE (adata.X, 27,518 genes), CFG OFF.
#   source = A549 vehicle+vehicle control   →   target = perturbed (drug_0, drug_1) combos
# COMBINATION conditioning: the zarr's condition carries BOTH drug_0 and drug_1 (256-d each) plus
# cell_line; the set-encoder builds one MLP per modality and pools them, so both drugs are used.
# condition_dropout_prob=0.0 → CFG off (single w=1.0, no v_null). No dose (constant in this dataset).
#
# For permutation-invariant combo handling (drug_0/drug_1 order-independent), switch the condition
# encoder to the transformer: add `- /condition_encoder: transformer` to the defaults below, or run
#   python experiments/train_zarr.py +experiment=combo_gene_x condition_encoder=transformer
#
#   python experiments/train_zarr.py +experiment=combo_gene_x wandb.run_name=my_run
# ─────────────────────────────────────────────────────────────────────────────
defaults:
  - override /datasets: zarr_sciplex
  - override /conditioning: adaln_zero
  - override /embedding: combo_X
  - override /ablation: default
  - override /split: combo_631          # 60/30/10 held out by (drug_0, drug_1) combination

selected_datasets: [sciplex]
output_dir: /storage/pancellflow/outputs/combo_gene_x

model:
  hidden_dims: [256, 256, 256]
  decoder_dims: [256, 256, 256]          # adaln_zero requires decoder_dims[-1] == hidden_dims[-1]
  condition_embedding_dim: 256
  condition_dropout_prob: 0.0            # CFG OFF → conditional-only, single w=1.0
  layer_norm_before_concatenation: false
  probability_path_kwargs:
    constant_noise: 0.1
  condition_encoder:
    cond_output_dropout: 0.2

ablation:
  mode: prophet

match_fn:
  epsilon: 10                            # gene-space OT coupling (matches gene_x)

training:
  peak_lr: 1.0e-4
  batch_size: 512
  warmup_iterations: 5000
  num_iterations: 2000000
  valid_freq: 200000

wandb:
  enabled: true
  entity: pancellflow
  project: combosciplex
  run_name: combo_gene_x
